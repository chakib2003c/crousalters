name: CROUS Logement Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Reset state and alert again for all currently available rooms?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["main"]

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset state if requested
        if: ${{ github.event.inputs.reset_state == 'true' }}
        run: |
          echo '{"seen_ids": [], "updated_at": "2025-01-01T00:00:00"}' > state.json
          echo "State reset requested."

      - name: Run CROUS scraper
        run: python check_crous.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git commit -m "Update CROUS state" || echo "No changes to commit"
          git push
